<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Meridia — Plan interactif</title>
<style>
:root{
--ui-bg:#fff;--ui-fg:#202124;--ui-mute:#5f6368;--ui-line:#e3e5e8;--ui-hover:#f1f3f4;--ui-blue:#1a73e8;
--ui-shadow:0 1px 3px rgba(60,64,67,.3),0 4px 12px rgba(60,64,67,.15);
--outside:#e2e9d3;--city:#f1eee8;--proche:#eee9dd;--centre:#eae2cf;--zone-line:#a89670;
--water:#a8d3f3;--water-e:#84bbe6;--park:#c6e3ae;--forest:#b0d495;
--rd:#ffffff;--rd-case:#cdc7ba;--hw:#fbd680;--hw-case:#dfa543;--tcase:#ffffff;
--bshade:rgba(150,125,80,.15);--bshade2:rgba(150,125,80,.08);--btall:rgba(90,95,110,.32);--garden:rgba(150,200,110,.55);--roof:rgba(170,120,90,.32);
--dl:82%;--ll:30%;--halo:rgba(255,255,255,.85);--lbl2:#6b6e73;--kl:#2e7d3f;--wl:#3b7db8;--rw:#9aa0a6;
--k:1;
}
@media (prefers-color-scheme:dark){
:root:not([data-theme="light"]){
--ui-bg:#25272b;--ui-fg:#e8eaed;--ui-mute:#9aa0a6;--ui-line:#3a3d42;--ui-hover:#33363b;--ui-blue:#8ab4f8;
--ui-shadow:0 1px 3px rgba(0,0,0,.6),0 4px 12px rgba(0,0,0,.4);
--outside:#1a2118;--city:#22262b;--proche:#262a30;--centre:#2b3037;--zone-line:#6b6448;
--water:#1d3f5c;--water-e:#2a5679;--park:#233a2b;--forest:#1d3324;
--rd:#4b5058;--rd-case:#15181d;--hw:#8a6f31;--hw-case:#4a3a17;--tcase:#15181d;
--bshade:rgba(255,255,255,.05);--bshade2:rgba(255,255,255,.03);--btall:rgba(255,255,255,.10);--garden:rgba(90,140,90,.35);--roof:rgba(200,160,130,.20);
--dl:26%;--ll:72%;--halo:rgba(20,22,26,.85);--lbl2:#9aa0a6;--kl:#8fce9f;--wl:#7fb5e6;--rw:#5b6068;
}}
:root[data-theme="dark"]{
--ui-bg:#25272b;--ui-fg:#e8eaed;--ui-mute:#9aa0a6;--ui-line:#3a3d42;--ui-hover:#33363b;--ui-blue:#8ab4f8;
--ui-shadow:0 1px 3px rgba(0,0,0,.6),0 4px 12px rgba(0,0,0,.4);
--outside:#1a2118;--city:#22262b;--proche:#262a30;--centre:#2b3037;--zone-line:#6b6448;
--water:#1d3f5c;--water-e:#2a5679;--park:#233a2b;--forest:#1d3324;
--rd:#4b5058;--rd-case:#15181d;--hw:#8a6f31;--hw-case:#4a3a17;--tcase:#15181d;
--bshade:rgba(255,255,255,.05);--bshade2:rgba(255,255,255,.03);--btall:rgba(255,255,255,.10);--garden:rgba(90,140,90,.35);--roof:rgba(200,160,130,.20);
--dl:26%;--ll:72%;--halo:rgba(20,22,26,.85);--lbl2:#9aa0a6;--kl:#8fce9f;--wl:#7fb5e6;--rw:#5b6068;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:var(--outside);color:var(--ui-fg);font-family:"Google Sans",Roboto,system-ui,-apple-system,"Segoe UI",sans-serif}
#app{position:fixed;inset:0;height:100vh;height:100dvh}
#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;background:var(--outside)}
#map.drag{cursor:grabbing}
.panel{position:absolute;background:var(--ui-bg);border-radius:12px;box-shadow:var(--ui-shadow)}
button{font:inherit;color:inherit;cursor:pointer}
/* top panel */
#top{top:12px;left:12px;width:min(400px,calc(100% - 24px));z-index:6;overflow:visible}
#brand{display:flex;align-items:center;gap:10px;padding:10px 14px 4px}
#brand .logo{width:30px;height:30px;border-radius:8px;background:#1a73e8;color:#fff;display:grid;place-items:center;font-weight:700;font-size:17px}
#brand b{font-size:16px;letter-spacing:.01em}
#brand small{display:block;color:var(--ui-mute);font-size:11.5px;line-height:1.3}
#sbox{display:flex;align-items:center;gap:8px;margin:6px 10px 6px;padding:0 10px;height:42px;border:1px solid var(--ui-line);border-radius:22px;background:var(--ui-bg)}
#sbox:focus-within{border-color:var(--ui-blue);box-shadow:0 0 0 2px color-mix(in srgb,var(--ui-blue) 25%,transparent)}
#sbox svg{flex:none;color:var(--ui-mute)}
#q{flex:1;min-width:0;border:0;outline:0;background:transparent;color:inherit;font:inherit;font-size:14.5px}
#qx{border:0;background:transparent;color:var(--ui-mute);font-size:20px;line-height:1;padding:4px}
#layers{display:flex;gap:6px;padding:0 10px 10px;overflow-x:auto;scrollbar-width:none}
.lyr{flex:none;border:1px solid var(--ui-line);background:var(--ui-bg);border-radius:16px;padding:5px 11px;font-size:12.5px;color:var(--ui-mute)}
.lyr.on{background:color-mix(in srgb,var(--ui-blue) 14%,var(--ui-bg));border-color:color-mix(in srgb,var(--ui-blue) 45%,transparent);color:var(--ui-blue);font-weight:600}
#res{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--ui-bg);border-radius:12px;box-shadow:var(--ui-shadow);max-height:min(58vh,440px);overflow:auto;padding:6px}
#res h4{margin:8px 10px 4px;font-size:12px;font-weight:600;color:var(--ui-mute)}
.res{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;padding:7px 8px;border-radius:8px}
.res:hover,.res:focus-visible{background:var(--ui-hover);outline:0}
.ri{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-size:15px;color:#fff}
.res b{display:block;font-size:13.5px;font-weight:600}
.res small{display:block;color:var(--ui-mute);font-size:12px}
/* controls */
#ctrl{position:absolute;right:12px;bottom:26px;display:flex;flex-direction:column;gap:8px;z-index:5}
.cb{width:42px;height:42px;border:0;border-radius:10px;background:var(--ui-bg);box-shadow:var(--ui-shadow);font-size:20px;display:grid;place-items:center}
.cb:hover{background:var(--ui-hover)}
.cb.txt{font-size:11px;font-weight:600;line-height:1.1;text-align:center}
#lines{right:64px;bottom:26px;width:min(270px,calc(100% - 90px));padding:12px;z-index:5;max-height:60vh;overflow:auto}
#lines h3{margin:0 0 8px;font-size:13px}
#lines .lp{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;text-align:left;padding:5px 4px;border-radius:8px;font-size:12.5px}
#lines .lp:hover{background:var(--ui-hover)}
.chipl{flex:none;min-width:38px;text-align:center;color:#fff;font-weight:700;font-size:12px;border-radius:12px;padding:2px 8px}
#lines p{margin:8px 4px 0;font-size:11.5px;color:var(--ui-mute);line-height:1.4}
#sb{position:absolute;right:66px;bottom:8px;z-index:4;display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ui-fg);background:color-mix(in srgb,var(--ui-bg) 82%,transparent);padding:2px 8px;border-radius:6px}
#sbBar{height:6px;border:2px solid var(--ui-fg);border-top:0}
/* card */
#card{left:12px;bottom:12px;width:min(400px,calc(100% - 24px));max-height:46vh;overflow:auto;z-index:6;padding:16px}
#cardX{position:absolute;right:10px;top:8px;border:0;background:transparent;font-size:22px;color:var(--ui-mute);line-height:1}
.ch{display:flex;gap:12px;align-items:center;padding-right:22px}
#cIc{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:22px;color:#fff}
#cName{margin:0;font-size:18px;line-height:1.2;font-weight:600}
#cNat{color:var(--ui-mute);font-size:13px;margin-top:2px}
#cChips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.chip{border:1px solid var(--ui-line);border-radius:12px;padding:2px 9px;font-size:12px;color:var(--ui-mute)}
#cDesc{margin:8px 0 0;font-size:13.5px;line-height:1.5}
#cExtra{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.pill{border:0;border-radius:14px;color:#fff;font-weight:700;font-size:12px;padding:4px 11px}
.sbtn{border:1px solid var(--ui-line);background:var(--ui-bg);border-radius:14px;font-size:12px;padding:4px 10px}
.sbtn:hover{background:var(--ui-hover)}
@media(max-width:700px){
#card{left:0;right:0;bottom:0;width:auto;border-radius:16px 16px 0 0;max-height:40vh}
#ctrl{top:150px;bottom:auto}
#lines{top:150px;bottom:auto;right:62px}
#sb{right:auto;left:10px;bottom:auto;top:auto;display:none}
}
/* map styling */
.t{font-family:"Google Sans",Roboto,system-ui,sans-serif;font-size:calc(var(--fs,11px)*var(--k));fill:var(--lbl2);paint-order:stroke;stroke:var(--halo);stroke-width:calc(3px*var(--k));stroke-linejoin:round;pointer-events:none;text-anchor:middle}
.lv2,.lv3,.pat{display:none}
svg[data-level="2"] .lv2,svg[data-level="3"] .lv2,svg[data-level="3"] .lv3{display:inline}
svg[data-level="2"] .pat,svg[data-level="3"] .pat{display:inline}
svg:not([data-level="1"]) .only1{display:none}
.zone{fill:var(--proche);stroke:none}
.zl{fill:none;stroke:var(--zone-line);stroke-width:calc(1.5px*var(--k));stroke-dasharray:calc(9px*var(--k)) calc(6px*var(--k));pointer-events:none}
.zt{--fs:26px;fill:var(--zone-line);opacity:.55;letter-spacing:.35em;font-weight:700;stroke:none}
.df{fill:hsl(var(--h) var(--s) var(--dl)/.62);stroke:hsl(var(--h) 25% 55%/.55);stroke-width:calc(1.2px*var(--k));cursor:pointer}
.df.cyb{fill:#170b36;stroke:#ff2bd6;stroke-opacity:.8}
.df.sel,.pk.sel{stroke:#1a73e8;stroke-width:calc(3px*var(--k));stroke-opacity:1}
.pk{fill:var(--park);stroke:none;cursor:pointer}
.pk.forest{fill:var(--forest)}
.dl{fill:hsl(var(--h) 45% var(--ll));letter-spacing:.09em;font-weight:700}
.dl.nat{font-weight:500;letter-spacing:.03em;transform:translateY(calc(13px*var(--k)));--fs:10.5px}
.dl.cy{fill:#ff7ae9;stroke:#12082b}
.kl{fill:var(--kl);font-style:italic;--fs:11px}
.wl{fill:var(--wl);font-style:italic;letter-spacing:.14em;--fs:12px}
.rl{fill:var(--lbl2);--fs:10px;letter-spacing:.04em}
.rc,.rf{fill:none;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.rc.hwy{stroke:var(--hw-case);stroke-width:18}.rf.hwy{stroke:var(--hw);stroke-width:13}
.rc.art2{stroke:var(--rd-case);stroke-width:17}.rf.art2{stroke:var(--rd);stroke-width:12}
.rc.art{stroke:var(--rd-case);stroke-width:11}.rf.art{stroke:var(--rd);stroke-width:8}
.rc.ave{stroke:var(--rd-case);stroke-width:8}.rf.ave{stroke:var(--rd);stroke-width:5.5}
.rc.neon{stroke:#3a0f57;stroke-width:9}.rf.neon{stroke:#ff4fd8;stroke-width:4.5}
.rc.neon2{display:none}.rf.neon2{stroke:#00e5ff;stroke-width:2.6;opacity:.75}
.rw{stroke:var(--rw);stroke-width:10;stroke-linecap:butt;fill:none}
.term{fill:var(--rw)}
.stad{fill:var(--park);stroke:var(--rw);stroke-width:3}
.tw{fill:var(--btall);stroke:none}.twS{fill:rgba(0,0,0,.18)}
.cw{fill:#241552;stroke-width:1.6}.cwS{fill:#0d0622}
.lake{fill:var(--water);stroke:var(--water-e);stroke-width:calc(1.5px*var(--k));cursor:pointer}
.isl{cursor:pointer}
.wt{fill:none;stroke-linecap:round;stroke-linejoin:round}
.wte{stroke:var(--water-e)}.wtf{stroke:var(--water)}
.bs{fill:var(--bshade)}.bs2{fill:var(--bshade2)}.bc{fill:var(--rd);opacity:.5}.bt{fill:var(--btall)}.gs{fill:var(--garden)}.hs{fill:var(--roof)}.pool{fill:var(--water)}.ps{stroke:var(--rd);fill:none}
.fa{fill:rgba(140,170,90,.13)}.fb{fill:rgba(200,205,110,.16)}
/* transit */
#gTransit{--lw:calc(2.6px*var(--k) + 1.2px)}
.tc,.tl{fill:none;stroke-linecap:round;stroke-linejoin:round}
.tc{stroke:var(--tcase);stroke-width:calc(var(--lw) + 3px*var(--k));pointer-events:none}
.tl{stroke-width:var(--lw);pointer-events:stroke;cursor:pointer}
.tc.axis,.tl.axis{stroke-dasharray:calc(13px*var(--k)) calc(5px*var(--k));stroke-linecap:butt}
.tl.axis{stroke-width:calc(var(--lw)*1.55)}.tc.axis{stroke-width:calc(var(--lw)*1.55 + 3px*var(--k))}
.tc.tram,.tl.tram{stroke-dasharray:calc(7px*var(--k)) calc(3px*var(--k));stroke-linecap:butt}
.tc.boat{display:none}
.tl.boat{stroke:#5fb4ea;stroke-dasharray:calc(1px*var(--k)) calc(6px*var(--k));stroke-width:calc(var(--lw)*1.5)}
.tl.neon{filter:drop-shadow(0 0 calc(3px*var(--k)) #ff2bd6)}
.sc{fill:var(--ui-bg);stroke-width:2.4}
.sc.ix{stroke:#222!important;stroke-width:2.6;fill:#fff}
.axs{fill:#fff;stroke:#c8102e;stroke-width:3}
.axc{fill:#c8102e;stroke:#fff;stroke-width:2.5}
.sl{--fs:10.5px;text-anchor:start;transform:translate(calc(9px*var(--k)),calc(3.5px*var(--k)))}
.sl.b{font-weight:700;fill:var(--ui-fg)}
.sl.l{text-anchor:end;transform:translate(calc(-9px*var(--k)),calc(3.5px*var(--k)))}
.st{cursor:pointer}
svg.focus [data-lines]{opacity:.13}
svg.focus [data-lines].on{opacity:1}
.mk{transform:scale(var(--k))}
.em{font-size:12px;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.poi{cursor:pointer}
.poi circle{stroke:#fff;stroke-width:2}
.pl{--fs:11.5px;font-weight:600;fill:var(--ui-fg);text-anchor:start;transform:translate(calc(14px*var(--k)),calc(4px*var(--k)))}
.ax-lbl{--fs:12px;fill:#c8102e;font-weight:700;stroke:var(--halo)}
.pulse{fill:none;stroke:#1a73e8;stroke-width:calc(3px*var(--k));animation:pu 1.2s ease-out 2;pointer-events:none}
@keyframes pu{from{r:calc(6px*var(--k));opacity:.95}to{r:calc(44px*var(--k));opacity:0}}
#app.off-transit #gTransit{display:none}
#app.off-poi #gPoi{display:none}
#app.off-dist #gDist,#app.off-dist #lblDist{display:none}
#app.off-zone #gZone,#app.off-zone #lblZone{display:none}
@media (prefers-reduced-motion:reduce){.pulse{animation:none;r:calc(20px*var(--k))}}
</style>
</head>
<body>
<div id="app">
<svg id="map" xmlns="http://www.w3.org/2000/svg" data-level="2" role="img" aria-label="Plan interactif de la ville fictive de Meridia">
<defs id="defs"></defs>
<g id="gBase"></g><g id="gDist"></g><g id="gPark"></g><g id="gZone"></g><g id="gWater"></g><g id="gRoad"></g><g id="gBld"></g><g id="gTransit"></g>
<g id="lblZone"></g><g id="lblDist"></g><g id="lblPark"></g><g id="lblWater"></g><g id="lblRoad"></g><g id="gPoi"></g><g id="gFx"></g>
</svg>
 
<div id="top" class="panel">
  <div id="brand"><div class="logo">M</div><div><b>Meridia</b><small>Mégalopole fictive · 14,6 M d'habitants · 2 880 km²</small></div></div>
  <div id="sbox">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input id="q" type="search" placeholder="Lieu, quartier, station…" autocomplete="off" aria-label="Rechercher">
    <button id="qx" hidden aria-label="Effacer">×</button>
  </div>
  <div id="layers">
    <button class="lyr on" data-l="transit">Transports</button>
    <button class="lyr on" data-l="poi">Lieux</button>
    <button class="lyr on" data-l="dist">Quartiers</button>
    <button class="lyr on" data-l="zone">Zones</button>
  </div>
  <div id="res" hidden></div>
</div>
 
<div id="ctrl">
  <button class="cb txt" id="bLines" aria-label="Lignes de transport">Lignes</button>
  <button class="cb txt" id="bAll" aria-label="Vue d'ensemble">Vue<br>globale</button>
  <button class="cb" id="bIn" aria-label="Zoom avant">+</button>
  <button class="cb" id="bOut" aria-label="Zoom arrière">−</button>
</div>
<div id="lines" class="panel" hidden></div>
<div id="sb"><div id="sbBar"></div><span id="sbTxt"></span></div>
 
<div id="card" class="panel" hidden>
  <button id="cardX" aria-label="Fermer">×</button>
  <div class="ch"><div id="cIc"></div><div><h2 id="cName"></h2><div id="cNat"></div></div></div>
  <div id="cChips"></div>
  <p id="cDesc"></p>
  <div id="cExtra"></div>
</div>
</div>
 
<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const P=a=>a.map(p=>p[0]+","+p[1]).join(" ");
const L=a=>"M"+a.map(p=>p[0]+" "+p[1]).join("L");
const f1=n=>Math.round(n*10)/10;
function smooth(p,closed){
  const n=p.length;let d="M"+p[0][0]+" "+p[0][1];const cnt=closed?n:n-1;
  for(let i=0;i<cnt;i++){
    const p0=closed?p[(i-1+n)%n]:p[Math.max(i-1,0)],p1=p[i],p2=p[(i+1)%n],p3=closed?p[(i+2)%n]:p[Math.min(i+2,n-1)];
    d+="C"+f1(p1[0]+(p2[0]-p0[0])/6)+" "+f1(p1[1]+(p2[1]-p0[1])/6)+" "+f1(p2[0]-(p3[0]-p1[0])/6)+" "+f1(p2[1]-(p3[1]-p1[1])/6)+" "+p2[0]+" "+p2[1];
  }
  return closed?d+"Z":d;
}
const ell=e=>{const[cx,cy,rx,ry]=e;return `M${cx-rx} ${cy}A${rx} ${ry} 0 1 1 ${cx+rx} ${cy}A${rx} ${ry} 0 1 1 ${cx-rx} ${cy}Z`};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function inPoly(x,y,p){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){if(((p[i][1]>y)!=(p[j][1]>y))&&(x<(p[j][0]-p[i][0])*(y-p[i][1])/(p[j][1]-p[i][1])+p[i][0]))c=!c}return c}
const cent=p=>[p.reduce((a,q)=>a+q[0],0)/p.length,p.reduce((a,q)=>a+q[1],0)/p.length];
const bbox=p=>{const xs=p.map(q=>q[0]),ys=p.map(q=>q[1]);return[Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys)]};
const norm=s=>String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
 
/* ---------- Géographie ---------- */
const ZN=[[2000,1200,700,500,"Centre-ville"],[2000,1200,1300,850,"Proche banlieue"],[2000,1200,1950,1180,"Banlieue"]];
const zoneOf=(x,y)=>{for(const z of ZN){if(((x-z[0])/z[2])**2+((y-z[1])/z[3])**2<=1)return z[4]}return "Campagne périphérique"};
const RIVER=[[2570,-40],[2490,180],[2385,380],[2310,560],[2330,760],[2275,960],[2215,1120],[2255,1290],[2330,1440],[2270,1620],[2200,1780],[2140,1940],[2165,2100],[2250,2250],[2310,2450]];
const LAKE=[[3230,520],[3300,455],[3420,440],[3540,480],[3575,560],[3480,622],[3350,600],[3265,590]];
 
/* Motifs de rues / bâti */
const PB={
pHauss:[70,70,`<rect x="6" y="6" width="58" height="58" rx="2" class="bs"/><rect x="22" y="22" width="26" height="26" class="bc"/><path d="M0 0H70M0 0V70" class="ps" style="stroke-width:5"/>`],

  tw.forEach((t,i)=>{const w=14+R2()*22,c=i%2?"#00e5ff":"#ff2bd6";b+=`<rect class="pat cwS" x="${f1(t[0]+4)}" y="${f1(t[1]-4)}" width="${f1(w)}" height="${f1(w)}"/><rect class="pat cw" style="stroke:${c}" x="${f1(t[0])}" y="${f1(t[1])}" width="${f1(w)}" height="${f1(w)}"/>`});
  b+=`<ellipse class="lv2 stad" cx="3010" cy="1760" rx="58" ry="42"/><ellipse class="lv2" cx="3010" cy="1760" rx="34" ry="22" fill="var(--park)" stroke="var(--rw)" stroke-width="2"/>`;
  b+=`<path class="lv2 rw" d="M3400 2080L3850 2040M3420 2140L3860 2100"/><rect class="lv2 term" x="3510" y="1962" width="90" height="26" rx="4" transform="rotate(-5 3555 1975)"/>`;
  b+=`<rect class="lv2 term" x="3186" y="1180" width="60" height="40" rx="0" style="fill:none;stroke:var(--btall);stroke-width:12"/>`;
  q("gBld").innerHTML=b;
  /* transports */
  let tc="",tl="";
  LINES.forEach(l=>{
    const d=l.ring?ell(l.ring):l.kind==="boat"?smooth(RIVER.slice(2,12)):L(RP(l))+(l.loop?"Z":"");
    tc+=`<path class="tc ${l.kind||""}" d="${d}" data-lines="${l.id}"/>`;
    tl+=`<path class="tl ${l.kind||""}" d="${d}" style="stroke:${l.c}" data-lines="${l.id}" data-id="l:${l.id}"/>`;
    const pts=l.ring?[[1000,520],[3000,1880]]:RP(l);
    const bb=bbox(pts);
    REG["l:"+l.id]={id:"l:"+l.id,kind:"line",line:l,name:l.id==="axis"?"Ligne AXIS · train à subduction":l.id==="rb"?"Bateau-bus du Sorane":l.id.startsWith("t")?"Tramway "+l.n:l.id==="neon"?"Monorail NEON":"Métro "+l.n,nat:"",ic:l.id==="axis"?"🚄":l.kind==="boat"?"⛴️":l.kind==="tram"?"🚊":"🚇",catLabel:l.kind==="boat"?"Transport fluvial":l.kind==="tram"?"Tramway":l.id==="axis"?"Grande vitesse":l.id==="neon"?"Monorail":"Métro",col:l.c,x:(bb[0]+bb[2])/2,y:(bb[1]+bb[3])/2,desc:l.d,bb};
  });
  let st="";
  for(const k in S){
    const s=S[k],ls=s.lines,inter=ls.length>1,isAx=ls.includes("axis"),lvc=(k==="ctr"||isAx)?"":inter?" lv2":" lv3";
    const col=(LINES.find(l=>l.id===ls[0])||{}).c||"#333";
    st+=`<g class="st${lvc}" data-id="s:${k}" data-lines="${ls.join(" ")}" transform="translate(${s[1]},${s[2]})"><g class="mk">`;
    if(k==="ctr")st+=`<rect x="-12" y="-12" width="24" height="24" rx="7" class="axc"/><text class="em" style="font-size:13px">🚄</text>`;
    else if(isAx)st+=`<rect x="-6.5" y="-6.5" width="13" height="13" rx="3.5" class="axs"/>`;
    else st+=`<circle r="${inter?6:4.3}" class="sc${inter?" ix":""}" style="stroke:${col}"/>`;
    st+=`</g><text class="t sl${inter||isAx?" b":""}${s[4]==="l"?" l":""}" style="--fs:${k==="ctr"?13:10.5}px">${esc(s[0])}</text></g>`;
    REG["s:"+k]={id:"s:"+k,kind:"station",key:k,name:s[0],nat:s[3]||"",ic:"🚉",catLabel:isAx?"Gare AXIS":ls.some(x=>x.startsWith("m"))?"Station de métro":"Station",col:"#334155",x:s[1],y:s[2],desc:k==="ctr"?"La gare souterraine à l'origine de la ville : quatre lignes de métro s'y croisent et le train AXIS y rejoint Castelmar en 24 minutes et Tsukishiro en 31. Tout le reste de Meridia s'est développé autour de cette gare.":isAx?"Gare de la ligne AXIS (train à subduction).":"Station desservie par : "+ls.map(x=>LINES.find(l=>l.id===x).n).join(", ")+"."};
  }
  q("gTransit").innerHTML=tc+tl+st;
  /* POI */
  let pH="";
  POIS.forEach((p,i)=>{
    const c=CATS[p[2]],lc=p[6]===2?" lv2":" lv3";
    pH+=`<g class="poi${lc}" data-id="p:${i}" transform="translate(${p[4]},${p[5]})"><g class="mk"><circle r="10" style="fill:${c[1]}"/><text class="em">${p[3]}</text></g><text class="t pl">${esc(p[0])}</text></g>`;
    REG["p:"+i]={id:"p:"+i,kind:"poi",name:p[0],nat:p[1],ic:p[3],catLabel:c[0],col:c[1],x:p[4],y:p[5],desc:p[7],z:1.5};
  });
  q("gPoi").innerHTML=pH;
  q("defs").insertAdjacentHTML("afterbegin",Object.values(usedPat).join(""));
}
build();
 
/* ---------- Vue / interactions ---------- */
const box=$("#app"),svg=$("#map"),card=$("#card");
const MW=4000,MH=2400;let W=box.clientWidth,H=box.clientHeight;
let view={cx:2000,cy:1200,s:0.45};
const minS=()=>Math.min(W/4200,H/2520);
function clampView(){view.s=Math.max(minS(),Math.min(4,view.s));view.cx=Math.max(0,Math.min(MW,view.cx));view.cy=Math.max(0,Math.min(MH,view.cy))}
function scaleBar(){const mpp=20/view.s,nice=[50,100,200,500,1000,2000,5000,10000,20000,50000];let m=nice[0];for(const v of nice){if(v/mpp<=110)m=v}
  $("#sbBar").style.width=(m/mpp)+"px";$("#sbTxt").textContent=m>=1000?(m/1000)+" km":m+" m"}
function apply(){const w=W/view.s,h=H/view.s;svg.setAttribute("viewBox",`${view.cx-w/2} ${view.cy-h/2} ${w} ${h}`);svg.style.setProperty("--k",(1/view.s).toFixed(4));
  const lv=view.s<0.32?1:view.s<0.75?2:3;if(svg.dataset.level!=lv)svg.dataset.level=lv;scaleBar()}
function zoomAt(px,py,f){const r=svg.getBoundingClientRect(),ox=px-r.left-W/2,oy=py-r.top-H/2,mx=view.cx+ox/view.s,my=view.cy+oy/view.s;
  view.s=Math.max(minS(),Math.min(4,view.s*f));view.cx=mx-ox/view.s;view.cy=my-oy/view.s;clampView();apply()}
let anim=0;
function flyTo(cx,cy,s,dur=750){cancelAnimationFrame(anim);const a={...view},b={cx,cy,s:Math.max(minS(),Math.min(4,s))},t0=performance.now();
  const step=t=>{let u=Math.min(1,(t-t0)/dur);u=u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;
    view.s=Math.exp(Math.log(a.s)+(Math.log(b.s)-Math.log(a.s))*u);view.cx=a.cx+(b.cx-a.cx)*u;view.cy=a.cy+(b.cy-a.cy)*u;clampView();apply();if(u<1)anim=requestAnimationFrame(step)};
  anim=requestAnimationFrame(step)}
function focusOn(x,y,s){const off=W<700?(H*0.2)/s:0;flyTo(x,y+off,s)}
function fitBB(bb,pad){const bw=Math.max(60,bb[2]-bb[0]),bh=Math.max(60,bb[3]-bb[1]);const s=Math.min(W*(pad||.62)/bw,H*(pad||.62)/bh);
  focusOn((bb[0]+bb[2])/2,(bb[1]+bb[3])/2,Math.max(.3,Math.min(1.6,s)))}
function initView(){view.s=Math.max(.28,Math.min(.6,W/2600));view.cx=2000;view.cy=1200;clampView();apply()}
 
svg.addEventListener("wheel",e=>{e.preventDefault();zoomAt(e.clientX,e.clientY,Math.exp(-e.deltaY*(e.ctrlKey?.01:.0016)))},{passive:false});
svg.addEventListener("dblclick",e=>{zoomAt(e.clientX,e.clientY,1.8)});
const ptr=new Map();let moved=0,pinch=null,armed=false;
svg.addEventListener("pointerdown",e=>{ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});cancelAnimationFrame(anim);
  if(ptr.size===1){moved=0;armed=true}else if(ptr.size===2){const[a,b]=[...ptr.values()];pinch=Math.hypot(a.x-b.x,a.y-b.y);moved=99}
  svg.classList.add("drag")});
window.addEventListener("pointermove",e=>{const p=ptr.get(e.pointerId);if(!p)return;const dx=e.clientX-p.x,dy=e.clientY-p.y;p.x=e.clientX;p.y=e.clientY;
  if(ptr.size===1){view.cx-=dx/view.s;view.cy-=dy/view.s;moved+=Math.abs(dx)+Math.abs(dy);clampView();apply()}
  else if(ptr.size===2&&pinch){const[a,b]=[...ptr.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);zoomAt((a.x+b.x)/2,(a.y+b.y)/2,d/pinch);pinch=d}});
const endP=e=>{if(!ptr.has(e.pointerId))return;const one=ptr.size===1;ptr.delete(e.pointerId);if(ptr.size<2)pinch=null;if(!ptr.size)svg.classList.remove("drag");
  if(one&&armed&&moved<6&&e.type==="pointerup"&&svg.contains(e.target))clickMap(e.target);if(!ptr.size)armed=false};
window.addEventListener("pointerup",endP);window.addEventListener("pointercancel",endP);
window.addEventListener("resize",()=>{W=box.clientWidth;H=box.clientHeight;clampView();apply()});
 
/* sélection */
let selEl=null;
function clickMap(t){const el=t.closest&&t.closest("[data-id]");if(el)select(el.dataset.id,false);else{closeCard()}}
function focusLine(id){svg.classList.toggle("focus",!!id);svg.querySelectorAll("[data-lines]").forEach(e=>e.classList.toggle("on",!!id&&e.dataset.lines.split(" ").includes(id)))}
function pulse(x,y){const g=$("#gFx");g.innerHTML=`<circle class="pulse" cx="${x}" cy="${y}"/>`;setTimeout(()=>{g.innerHTML=""},2600)}
function select(id,fly){
  const it=REG[id];if(!it)return;showCard(it);
  if(selEl)selEl.classList.remove("sel");selEl=svg.querySelector(`[data-id="${id}"].df, [data-id="${id}"].pk`);if(selEl)selEl.classList.add("sel");
  focusLine(it.kind==="line"?it.line.id:null);
  if(fly||it.kind==="line"){
    if(it.kind==="line")fitBB(it.bb,.7);else if(it.bb&&(it.kind==="district"||it.kind==="park"))fitBB(it.bb,.6);else focusOn(it.x,it.y,it.z||1.5);
    if(it.kind!=="line")pulse(it.x,it.y);
  }
}
function showCard(it){
  card.hidden=false;const ic=$("#cIc");ic.textContent=it.ic;ic.style.background=it.col||"var(--ui-blue)";
  $("#cName").textContent=it.name;$("#cNat").textContent=it.nat||"";$("#cNat").hidden=!it.nat;
  $("#cChips").innerHTML=`<span class="chip">${esc(it.catLabel)}</span>`+(it.kind!=="line"?`<span class="chip">${zoneOf(it.x,it.y)}</span>`:"");
  $("#cDesc").textContent=it.desc;
  let ex="";
  if(it.kind==="station")ex=S[it.key].lines.map(x=>{const l=LINES.find(z=>z.id===x);return `<button class="pill" style="background:${l.c}" data-go="l:${l.id}">${l.n}</button>`}).join("");
  if(it.kind==="line"){const l=it.line;ex=l.r.filter(k=>typeof k==="string").map(k=>`<button class="sbtn" data-go="s:${k}">${esc(S[k][0])}</button>`).join("")}
  $("#cExtra").innerHTML=ex;
}
function closeCard(){card.hidden=true;if(selEl){selEl.classList.remove("sel");selEl=null}focusLine(null);$("#gFx").innerHTML=""}
$("#cardX").addEventListener("click",closeCard);
$("#cExtra").addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(b)select(b.dataset.go,true)});
 
/* commandes */
$("#bIn").addEventListener("click",()=>flyTo(view.cx,view.cy,view.s*1.7,350));
$("#bOut").addEventListener("click",()=>flyTo(view.cx,view.cy,view.s/1.7,350));
$("#bAll").addEventListener("click",()=>{closeCard();flyTo(2000,1200,minS()*1.02,900)});
const linesP=$("#lines");
linesP.innerHTML=`<h3>Lignes de transport</h3>`+LINES.map(l=>`<button class="lp" data-go="l:${l.id}"><span class="chipl" style="background:${l.c}">${l.n}</span><span>${esc(REG["l:"+l.id].name)}</span></button>`).join("")+`<p>Cliquez sur une ligne pour la mettre en évidence. Les tirets rouges figurent le tunnel de l'Axe, souterrain et rectiligne.</p>`;
linesP.addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(b)select(b.dataset.go,true)});
$("#bLines").addEventListener("click",()=>{linesP.hidden=!linesP.hidden});
document.querySelectorAll(".lyr").forEach(b=>b.addEventListener("click",()=>{b.classList.toggle("on");box.classList.toggle("off-"+b.dataset.l,!b.classList.contains("on"))}));
 
/* recherche */
const idx=Object.values(REG).map(it=>({it,n:norm(it.name+" "+(it.nat||"")+" "+it.catLabel)}));
const q=$("#q"),res=$("#res");
const QUICK=["s:ctr","d:yoru-machi","d:grands-boulevards","d:belmont","d:sakura-machi","d:horizon","l:axis"];
function rowHTML(it){return `<button class="res" data-go="${it.id}"><span class="ri" style="background:${it.col||"#1a73e8"}">${it.ic}</span><span><b>${esc(it.name)}</b><small>${esc(it.catLabel)}${it.nat?" · "+esc(it.nat):""}${it.kind!=="line"?" · "+zoneOf(it.x,it.y):""}</small></span></button>`}
function renderRes(){const v=norm(q.value.trim());$("#qx").hidden=!q.value;
  if(!v){res.innerHTML=`<h4>Lieux à voir</h4>`+QUICK.map(k=>rowHTML(REG[k])).join("")}
  else{const m=idx.filter(o=>o.n.includes(v)).sort((a,b)=>(a.n.startsWith(v)?0:1)-(b.n.startsWith(v)?0:1)).slice(0,9);
    res.innerHTML=m.length?m.map(o=>rowHTML(o.it)).join(""):`<h4>Aucun résultat pour « ${esc(q.value)} »</h4>`}
  res.hidden=false}
q.addEventListener("focus",renderRes);q.addEventListener("input",renderRes);
q.addEventListener("keydown",e=>{if(e.key==="Enter"){const b=res.querySelector(".res");if(b){select(b.dataset.go,true);res.hidden=true;q.blur()}}if(e.key==="Escape"){res.hidden=true;q.blur()}});
$("#qx").addEventListener("click",()=>{q.value="";renderRes();q.focus()});
res.addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(b){select(b.dataset.go,true);res.hidden=true;q.blur()}});
document.addEventListener("pointerdown",e=>{if(!e.target.closest("#top"))res.hidden=true});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!card.hidden)closeCard()});
 
initView();
</script>
</body>
